name: desktop-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python runtime & contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Full pytest suite (runtime, desktop API, release contracts)
        run: uv run --no-sync pytest -q

  desktop-rust:
    name: Rust bridge (cargo check + auth tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --all-targets
      - name: cargo test (sidecar bridge)
        working-directory: desktop/src-tauri
        run: cargo test

  desktop-ui:
    name: Desktop UI (syntax + Playwright e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check
        run: node --check desktop/ui/app.js
      - name: npm ci
        working-directory: desktop
        run: npm ci
      - name: Install Playwright chromium headless shell
        working-directory: desktop
        run: npx playwright install chromium --only-shell
      - name: Playwright static UI tests
        working-directory: desktop
        run: npx playwright test

  sidecar:
    name: Sidecar freshness contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: uv sync
      - name: Build sidecar from current source
        run: sh scripts/build_sidecar.sh
      - name: Bundled sidecar must match source version
        run: uv run --no-sync pytest tests/test_release_contract.py -q
