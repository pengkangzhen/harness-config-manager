name: windows-app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows app (NSIS + MSI + portable)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Sync Python deps (incl. PyInstaller)
        run: uv sync

      - name: Build halter sidecar (x86_64-pc-windows-msvc)
        shell: bash
        run: SIDECAR_TARGET=x86_64-pc-windows-msvc sh scripts/build_sidecar.sh

      - name: Smoke-test sidecar
        shell: bash
        run: |
          ./desktop/src-tauri/binaries/halter-x86_64-pc-windows-msvc.exe version --json
          ./desktop/src-tauri/binaries/halter-x86_64-pc-windows-msvc.exe --help >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: tauri build (NSIS bundle)
        working-directory: desktop
        run: npx tauri build --bundles nsis

      - name: Collect portable build
        shell: bash
        run: |
          mkdir -p windows-portable
          cp desktop/src-tauri/target/release/halter-desktop.exe windows-portable/
          cp desktop/src-tauri/binaries/halter-x86_64-pc-windows-msvc.exe windows-portable/halter.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: halter-windows-app
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            windows-portable/*

      # WSL 侧 api.github.com 被墙而 SSH 通：把产物发布到 windows-build 分支，
      # 本机用 git fetch --depth=1 origin windows-build 拉取。
      - name: Publish dist branch (windows-build)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIST="$(mktemp -d)"
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe "$DIST/"
          cp -r windows-portable "$DIST/"
          (
            cd "$DIST"
            git init -q -b windows-build
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "windows app build ${GITHUB_SHA}"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push -q --force origin windows-build
          )
