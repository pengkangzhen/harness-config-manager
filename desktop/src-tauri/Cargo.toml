[package]
name = "hcm-desktop"
version = "0.1.0"
description = "Harness Config Manager desktop app"
authors = ["pengkangzhen"]
license = "MIT"
repository = "https://github.com/pengkangzhen/harness-config-manager"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
